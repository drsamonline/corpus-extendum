name: scan

# Weekly: clone every vault, rebuild the catalogue from the vaults' own
# records, and commit if anything changed. The heartbeat line keeps GitHub
# from disabling the schedule after 60 days of inactivity.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: clone the vaults
        run: |
          mkdir -p ../vaults
          for repo in $(python3 -c "import json;print(' '.join(s['repo'] for s in json.load(open('data/shards.json'))))"); do
            git clone --depth 1 "https://github.com/$repo" "../vaults/$(basename "$repo")"
          done
          ls ../vaults

      - name: rotate if the open vault is full
        id: rotate
        env:
          CORPUS_BOT_TOKEN: ${{ secrets.CORPUS_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/rotate_vault.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            gh issue create \
              --title "A vault is full and could not be rotated" \
              --body "The open vault has reached its cap and the rotation token could not create a repository. Either add a CORPUS_BOT_TOKEN with Administration: write, or create the next vault by hand:\n\n\`\`\`\ngh repo create corpus-extendum-vault-NN --public\n\`\`\`\n\nThe run log above says which name it wanted." || true
            exit 1
          fi
          exit $code

      - name: rebuild the catalogue
        run: |
          args=""
          for d in ../vaults/*/; do args="$args --vault $d"; done
          python3 scripts/build_catalog.py $args

      - name: keep the documentation true
        run: |
          python3 scripts/update_docs.py --write
          python3 scripts/update_docs.py --check

      - name: mirror the documentation into the audit repo
        env:
          CORPUS_BOT_TOKEN: ${{ secrets.CORPUS_BOT_TOKEN }}
        run: |
          if [ -z "$CORPUS_BOT_TOKEN" ]; then echo "no token: skipping the audit mirror"; exit 0; fi
          git clone --depth 1 "https://x-access-token:$CORPUS_BOT_TOKEN@github.com/drsamonline/audit.git" ../audit
          python3 scripts/sync_docs.py --target ../audit/reports/2026-11-corpus-extendum
          cd ../audit
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "audit mirror already current"; else
            git commit -m "report: refresh the corpus-extendum doc mirror"
            git push
          fi

      - name: commit
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          echo "$(date -u +%FT%TZ) scan ok" >> data/scan-log.txt
          git add -A
          if git diff --staged --quiet; then echo "nothing changed"; else
            git commit -m "scan: rebuild catalogue from vaults"
            git push
          fi
